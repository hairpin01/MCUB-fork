loader:
  choose: |-
    <b>{mcub_emoji} installation</b>

    Оберіть платформу:
  choose_category: |-
    <b>{mcub_emoji} installation</b>

    Оберіть тип пристрою:
  arch: |-
    {emoji} <b>Arch Linux:</b>
    <pre>sudo pacman -Sy
    sudo pacman -S --noconfirm python3 python3-pip git
    git clone https://github.com/hairpin01/MCUB-fork.git
    cd MCUB-fork
    pip3 install -r requirements.txt
    python3 -m core --set-default-core standard
    python3 -m core --no-web</pre>
    {emoji_venv}<b> Під час встановлення MCUB всередині <u><code>proot-distro</code></u> або <u><code>WSL</code></u> рекомендується створити <u>venv</u>:</b>
    <pre><code class="language-shell">python3 -m venv .venv
    source .venv/bin/activate # Bash
    source .venv/bin/activate.fish # Fish</code></pre>
    {emoji_tip} TIP: рекомендуємо додати це в конфіг shell (bash):</b>
    <pre><code class="language-shell">echo 'source $HOME/.venv/activate' >> ~/.bashrc</code></pre>
    {emoji_elif} <b>Fish:</b><pre><code class="language-shell">echo 'source $HOME/.venv/activate.fish' >> ~/.config/fish/config.fish</code></pre>
  debian: |-
    {emoji} <b>Debian based:</b>
    <pre>sudo apt update
    sudo apt install -y python3 git
    git clone https://github.com/hairpin01/MCUB-fork.git
    cd MCUB-fork
    pip install -r requirements.txt
    python3 -m core --set-default-core standard
    python3 -m core --no-web</pre>
    {emoji_venv}<b> Під час встановлення MCUB всередині <u><code>proot-distro</code></u> або <u><code>WSL</code></u> рекомендується створити <u>venv</u>:</b>
    <pre><code class="language-shell">python3 -m venv .venv
    source .venv/bin/activate # Bash
    source .venv/bin/activate.fish # Fish</code></pre>
    {emoji_tip} TIP: рекомендуємо додати це в конфіг shell (bash):</b>
    <pre><code class="language-shell">echo 'source $HOME/.venv/activate' >> ~/.bashrc</code></pre>
    {emoji_elif} <b>Fish:</b><pre><code class="language-shell">echo 'source $HOME/.venv/activate.fish' >> ~/.config/fish/config.fish</code></pre>
  termux: |-
    {emoji} <b>Termux:</b>
    <pre>pkg update
    pkg install -y python3 git python-psutil
    git clone https://github.com/hairpin01/MCUB-fork.git
    cd MCUB-fork
    pip install -r requirements.txt
    python3 -m core --set-default-core standard
    python3 -m core --no-web</pre>
    {emoji_venv}<b> Щоб уникнути проблем із <u>pydantic_core</u> та <u>Telethon</u>, рекомендуємо встановити <u>Rust</u>:</b>
    <pre>pkg install rust</pre>
  btn_arch: |-
    Arch Linux
  btn_debian: |-
    Debian/Ubuntu
  btn_termux: |-
    Termux
  loading: |-
